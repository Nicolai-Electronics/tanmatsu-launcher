dependencies:
  idf: ">=6.0.2"
  espressif/cjson: "^1.7.19"
  badgeteam/badge-bsp: "=1.1.0"
  robotman2412/pax-gfx: "=2.2.2"
  robotman2412/pax-codecs: "=1.0.1"
  badgeteam/appfs: "=2.1.0"
  badgeteam/custom-certificates: "=1.1.0"
  nicolaielectronics/wifi-manager: "=0.3.0"
  nicolaielectronics/tanmatsu-wifi: "=1.3.1"
  badgeteam/badgelink: "=0.2.0"
  nicolaielectronics/tanmatsu-lora: "=0.6.0"
  nicolaielectronics/tanmatsu-addon: "=0.0.1"
  nicolaielectronics/tanmatsu-settings: "=1.2.0"
  nicolaielectronics/scd4x: "=0.0.1"
  nicolaielectronics/rvswd:
    version: "=0.3.0"
    rules:
      - if: target == esp32p4
  badgeteam/badge-elf:
    version: "=0.7.3"
    rules:
      - if: "target == esp32p4 && $CONFIG{ENABLE_LAUNCHERPLUGINS} == True"
    override_path: "../components/badge-elf"
  badgeteam/badge-elf-api:
    version: "=0.7.0"
    rules:
      - if: "target == esp32p4 && $CONFIG{ENABLE_LAUNCHERPLUGINS} == True"
  espressif/esp_tinyusb:
    version: "=2.2.1"
    rules:
      - if: target == esp32p4 || target == esp32s3
  badgeteam/esptool:
    version: "=0.1.0"
    rules:
      - if: target == esp32p4
